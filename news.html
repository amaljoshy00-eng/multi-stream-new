<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="common.css">
  <title>Advanced Multi Stream</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      overflow-y:auto;
    }

    .light{
      background:#f5f5f5;
      color:#111;
    }

    .light .card{
      background:#fff;
    }

    .light .top-bar{
      background:#fff;
      color:#111;
    }

    .light .footer{
      background:#ddd;
      color:#111;
    }

    .top-bar{
      background:#000;
      padding:12px;
      text-align:center;
    }

    input{
      padding:10px;
      width:60%;
      border:none;
      border-radius:6px;
      outline:none;
    }

    button{
      cursor:pointer;
    }

    .top-controls{
      position:fixed;
      top:15px;
      right:15px;
      z-index:9999999;

      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .top-controls button{
      background:red;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      font-weight:bold;
    }

    .menu-panel{
      position:fixed;
      top:70px;
      right:15px;
      z-index:9999999;

      display:flex;
      flex-direction:row;
      align-items:flex-start;
      gap:10px;
    }

    .menu-panel button{
      background:#222;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      font-weight:bold;
    }

    .dropdown-menu{
      display:none;
      flex-direction:column;
      gap:8px;
      margin-top:5px;
      align-items:flex-start;
    }

    .dropdown-menu button{
      background:#444;
      width:100%;
    }

    .active-quality{
      background:#00c853 !important;
      color:white !important;
    }

    .grid{
      display:grid;
      gap:6px;
      padding:6px;
      height:calc(100vh - 140px);
      transition:0.3s;
    }

    .card{
      background:#1c1c1c;
      border-radius:10px;
      overflow:hidden;
      position:relative;
      min-height:240px;
    }

    .player{
      width:100%;
      height:100%;
    }

    iframe{
      width:100% !important;
      height:100% !important;
      border:none;
    }

    .controls{
      position:absolute;
      top:5px;
      left:5px;
      z-index:99999;

      display:flex;
      gap:4px;
      flex-wrap:wrap;

      opacity:0;
      transition:0.3s;
    }

    .card:hover .controls{
      opacity:1;
    }

    .controls button{
      background:red;
      color:white;
      border:none;
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
    }

    .volume-slider{
      width:70px;
    }

    .favorite{
      background:gold !important;
      color:black !important;
    }

    .footer{
      position:fixed;
      bottom:0;
      width:100%;
      text-align:center;
      background:#000;
      color:#00ff88;
      padding:6px;
      font-size:12px;
    }

    @media(max-width:600px){

      input{
        width:90%;
      }

      .top-controls{
        top:auto;
        bottom:15px;
        right:10px;
      }

      .menu-panel{
        top:auto;
        bottom:70px;
        right:10px;
      }

      .controls{
        opacity:1;
      }

    }

  </style>
</head>

<body>
  
<body>

<button onclick="location.href='index.html'"
style="
position:fixed;
top:15px;
left:15px;
z-index:9999999;
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
cursor:pointer;">
⬅ Home
</button>

<!-- Your existing page content continues here -->

<div class="top-bar">

  <h2>🔥 Advanced Multi Stream</h2>

  <input id="link" placeholder="Paste YouTube link">

  <button onclick="addStream()">Add</button>

  <h3>
    🟢 Online:
    <span id="viewerCount">0</span>
  </h3>

</div>

<div class="top-controls">

  <button onclick="playAll()">▶ Play</button>

  <button onclick="pauseAll()">⏸ Pause</button>

  <button onclick="muteAll()">🔇 Mute</button>

  <button onclick="unmuteAll()">🔊 Unmute</button>

  <button onclick="toggleTheme()">🌙 Theme</button>

  <button onclick="toggleGlobalFullscreen()">
    ⛶ Full
  </button>

</div>

<div class="menu-panel">

  <div>

    <button onclick="toggleGridMenu()">
      🟦 Grid
    </button>

    <div id="gridMenu" class="dropdown-menu">

      <button onclick="setGridMode(1)">1×1</button>

      <button onclick="setGridMode(4)">2×2</button>

      <button onclick="setGridMode(9)">3×3</button>

      <button onclick="enableAutoGrid()">Auto</button>

    </div>

  </div>

  <div>

    <button onclick="toggleSettingsMenu()">
      ⚙ Settings
    </button>

    <div id="settingsMenu" class="dropdown-menu">

      <button onclick="setGlobalQuality('default')">
        Auto Quality
      </button>

      <button onclick="setGlobalQuality('small')">
        144p
      </button>

      <button onclick="setGlobalQuality('medium')">
        360p
      </button>

      <button onclick="setGlobalQuality('large')">
        480p
      </button>

      <button onclick="setGlobalQuality('hd720')">
        720p
      </button>

      <button onclick="setGlobalQuality('hd1080')">
        1080p
      </button>

    </div>

  </div>

</div>

<div class="grid" id="grid"></div>

<div class="footer">
  Developed by Amal Joshy🔥
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="https://www.youtube.com/iframe_api"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyBTPrDoxWQdEWLLHsUuJbv4cQX1vUd6lQY",

  authDomain: "multi-stream-ddb1d.firebaseapp.com",

  databaseURL: "https://multi-stream-ddb1d-default-rtdb.firebaseio.com",

  projectId: "multi-stream-ddb1d",

  appId: "1:305282777189:web:50adf19c4bbb1c8005c68c"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let apiReady = false;

function onYouTubeIframeAPIReady(){
  apiReady = true;
}

let players = {};

let manualGridEnabled = false;

let maxVisibleStreams = 9;

const userId =
  Math.random().toString(36).substring(2);

const userRef =
  db.ref("users/" + userId);

db.ref(".info/connected").on("value", snap => {

  if(snap.val()){

    userRef.set(true);

    userRef.onDisconnect().remove();

  }

});

db.ref("users").on("value", snap => {

  document.getElementById("viewerCount")
    .innerText = snap.numChildren();

});

db.ref("streams").on("value", snap => {

  const grid =
    document.getElementById("grid");

  Object.values(players).forEach(player => {

    if(player.destroy){
      player.destroy();
    }

  });

  players = {};

  grid.innerHTML = "";

  if(!manualGridEnabled){
    updateGrid(snap.numChildren());
  }

  snap.forEach(child => {

    createPlayer(child.val(), child.key);

  });

  applyVisibility();

});

function addStream(){

  let url =
    document.getElementById("link").value.trim();

  let id = getId(url);

  if(!id){

    alert("Invalid YouTube Link");

    return;

  }

  db.ref("streams").once("value", snap => {

    if(snap.numChildren() >= 9){

      alert("Maximum 9 streams");

      return;

    }

    db.ref("streams").push(id);

    document.getElementById("link").value = "";

  });

}

function createPlayer(id,key){

  if(!apiReady){

    setTimeout(() => {

      createPlayer(id,key);

    },500);

    return;

  }

  const grid =
    document.getElementById("grid");

  let div =
    document.createElement("div");

  div.className = "card";

  let playerDiv =
    document.createElement("div");

  playerDiv.className = "player";

  playerDiv.id = "player-" + key;

  div.appendChild(playerDiv);

  let controls =
    document.createElement("div");

  controls.className = "controls";

  let volume =
    document.createElement("input");

  volume.type = "range";

  volume.min = 0;

  volume.max = 100;

  volume.value = 100;

  volume.className = "volume-slider";

  volume.oninput = () => {

    if(players[key]){
      players[key].setVolume(volume.value);
    }

  };

  controls.appendChild(volume);

  /* ⛶ FULLSCREEN */

  let fullBtn =
    document.createElement("button");

  fullBtn.innerText = "⛶";

  fullBtn.onclick = () => {

    if(!document.fullscreenElement){

      div.requestFullscreen();

    }else{

      document.exitFullscreen();

    }

  };

  controls.appendChild(fullBtn);

  let favBtn =
    document.createElement("button");

  favBtn.innerText = "⭐";

  favBtn.onclick = () => {
    favBtn.classList.toggle("favorite");
  };

  controls.appendChild(favBtn);

  let delBtn =
    document.createElement("button");

  delBtn.innerText = "X";

  delBtn.onclick = () => {
    db.ref("streams/" + key).remove();
  };

  controls.appendChild(delBtn);

  div.appendChild(controls);

  grid.appendChild(div);

  players[key] =
    new YT.Player(playerDiv.id, {

      width:"100%",
      height:"100%",
      videoId:id,

      playerVars:{
        autoplay:1,
        mute:1,
        controls:1,
        playsinline:1,
        enablejsapi:1
      },

      events:{

        onReady:function(event){
          event.target.playVideo();
        }

      }

    });

}

function playAll(){

  Object.values(players).forEach(player => {

    try{
      player.playVideo();
    }catch(err){}

  });

}

function pauseAll(){

  Object.values(players).forEach(player => {

    try{
      player.pauseVideo();
    }catch(err){}

  });

}

function muteAll(){

  Object.values(players).forEach(player => {

    try{
      player.mute();
    }catch(err){}

  });

}

function unmuteAll(){

  Object.values(players).forEach(player => {

    try{
      player.unMute();
    }catch(err){}

  });

}

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* 🌐 GLOBAL FULLSCREEN */

function toggleGlobalFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement.requestFullscreen();

  }else{

    document.exitFullscreen();

  }

}

function toggleGridMenu(){

  const menu =
    document.getElementById("gridMenu");

  menu.style.display =
    menu.style.display === "flex"
      ? "none"
      : "flex";

}

function toggleSettingsMenu(){

  const menu =
    document.getElementById("settingsMenu");

  menu.style.display =
    menu.style.display === "flex"
      ? "none"
      : "flex";

}

function updateGrid(count){

  const grid =
    document.getElementById("grid");

  if(count === 1){

    grid.style.gridTemplateColumns = "1fr";

  }

  else if(count <= 4){

    grid.style.gridTemplateColumns =
      "repeat(2,1fr)";

  }

  else{

    grid.style.gridTemplateColumns =
      "repeat(3,1fr)";

  }

}

function setGridMode(limit){

  manualGridEnabled = true;

  maxVisibleStreams = limit;

  const grid =
    document.getElementById("grid");

  if(limit === 1){

    grid.style.gridTemplateColumns = "1fr";

  }

  else if(limit === 4){

    grid.style.gridTemplateColumns =
      "repeat(2,1fr)";

  }

  else{

    grid.style.gridTemplateColumns =
      "repeat(3,1fr)";

  }

  applyVisibility();

}

function enableAutoGrid(){

  manualGridEnabled = false;

  maxVisibleStreams = 9;

  updateGrid(
    document.querySelectorAll(".card").length
  );

  applyVisibility();

}

function applyVisibility(){

  const cards =
    document.querySelectorAll(".card");

  cards.forEach((card,index) => {

    card.style.display =
      index < maxVisibleStreams
        ? "block"
        : "none";

  });

}

function setGlobalQuality(quality){

  document
    .querySelectorAll("#settingsMenu button")
    .forEach(btn => {

      btn.classList.remove("active-quality");

    });

  event.target.classList.add("active-quality");

  Object.values(players).forEach(player => {

    try{

      player.setPlaybackQualityRange(
        quality,
        quality
      );

      player.setPlaybackQuality(quality);

      player.playVideo();

    }catch(err){

      console.log(err);

    }

  });

}

function getId(url){

  let r =
    /(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([^?&#]+)/;

  let m = url.match(r);

  return m ? m[1] : null;

}

new Sortable(
  document.getElementById("grid"),
  {
    animation:150
  }
);

</script>

</body>
</html>
