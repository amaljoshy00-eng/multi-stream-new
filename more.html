<!-- Shared More menu template for Multi Stream Hub category pages -->
<div class="ms-more-root" id="msMoreRoot">
  <button class="ms-more-trigger" id="moreButton" type="button" aria-expanded="false" aria-controls="morePanel">
    <span aria-hidden="true">☰</span> More
  </button>

  <section class="ms-more-panel" id="morePanel" aria-label="Stream controls" hidden>
    <div class="ms-more-heading">
      <div>
        <strong>Quick controls</strong>
        <small>Manage your streams</small>
      </div>
      <button class="ms-more-close" id="moreCloseButton" type="button" aria-label="Close menu">✕</button>
    </div>

    <div class="ms-more-section">
      <div class="ms-more-section-title">Playback & display</div>
      <div class="ms-more-controls-slot" id="moreControlsSlot"></div>
    </div>

    <div class="ms-more-divider"></div>

    <div class="ms-more-section">
      <div class="ms-more-section-title">Grid layout</div>
      <div class="ms-more-grid-slot" id="moreGridSlot"></div>
    </div>
  </section>
</div>
