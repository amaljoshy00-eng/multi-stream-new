<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="common.css">
  <title>Advanced Multi Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      overflow-y:auto;
    }

    .light{background:#f5f5f5;color:#111;}
    .light .card{background:#fff;}
    .light .top-bar{background:#fff;color:#111;}
    .light .footer{background:#ddd;color:#111;}

    .top-bar{
      background:#000;
      padding:12px;
      text-align:center;
    }

    input{
      padding:10px;
      width:60%;
      border:none;
      border-radius:6px;
      outline:none;
    }

    button{cursor:pointer;}

    .top-controls{
      position:fixed;
      top:15px;
      right:15px;
      z-index:9999999;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .top-controls button{
      background:red;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      font-weight:bold;
    }

    .menu-panel{
      position:fixed;
      top:70px;
      right:15px;
      z-index:9999999;
      display:flex;
      flex-direction:row;
      align-items:flex-start;
      gap:10px;
    }

    .menu-panel button{
      background:#222;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      font-weight:bold;
    }

    .dropdown-menu{
      display:none;
      flex-direction:column;
      gap:8px;
      margin-top:5px;
      align-items:flex-start;
    }

    .dropdown-menu button{
      background:#444;
      width:100%;
    }

    .active-quality{
      background:#00c853 !important;
      color:white !important;
    }

    .grid{
      display:grid;
      gap:6px;
      padding:6px;
      height:calc(100vh - 140px);
      transition:0.3s;
    }

    .card{
      background:#1c1c1c;
      border-radius:10px;
      overflow:hidden;
      position:relative;
      min-height:240px;
    }

    .player{
      width:100%;
      height:100%;
    }

    iframe{
      width:100% !important;
      height:100% !important;
      border:none;
    }

    .controls{
      position:absolute;
      top:5px;
      left:5px;
      z-index:99999;
      display:flex;
      gap:4px;
      flex-wrap:wrap;
      opacity:0;
      transition:0.3s;
    }

    .card:hover .controls{opacity:1;}

    .controls button{
      background:red;
      color:white;
      border:none;
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
    }

    .volume-slider{width:70px;}
    .favorite{background:gold !important;color:black !important;}

    .footer{
      position:fixed;
      bottom:0;
      width:100%;
      text-align:center;
      background:#000;
      color:#00ff88;
      padding:6px;
      font-size:12px;
    }

    @media(max-width:600px){
      input{width:90%;}

      .top-controls{
        top:auto;
        bottom:15px;
        right:10px;
      }

      .menu-panel{
        top:auto;
        bottom:70px;
        right:10px;
      }

      .controls{opacity:1;}
    }

    /* More menu: visible on desktop and mobile. */
    #moreButton {
      display:flex !important;
      position:fixed !important;
      top:12px !important;
      right:12px !important;
      z-index:2147483000 !important;
      align-items:center;
      justify-content:center;
      min-height:38px;
      padding:8px 13px !important;
      border:1px solid rgba(255,255,255,.2);
      border-radius:8px;
      background:#26313d;
      color:#fff;
      font-size:13px;
      font-weight:700;
    }

    #morePanel {
      display:none;
      position:fixed !important;
      top:58px !important;
      right:12px !important;
      z-index:2147482999 !important;
      width:min(520px, calc(100vw - 24px));
      max-height:75vh;
      overflow:auto;
      padding:12px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:12px;
      background:rgba(20,23,29,.98);
      box-shadow:0 10px 30px rgba(0,0,0,.55);
    }

    body.more-open #morePanel {
      display:block !important;
    }

    #morePanel .top-controls,
    #morePanel .menu-panel {
      position:static !important;
      inset:auto !important;
      display:flex !important;
      flex-wrap:wrap;
      justify-content:flex-start;
      align-items:center;
      gap:7px !important;
      width:100%;
      max-height:none !important;
      overflow:visible !important;
      margin:0 0 9px !important;
      padding:0 !important;
    }

    #morePanel .top-controls button,
    #morePanel .menu-panel button {
      min-height:36px;
      padding:7px 11px !important;
      font-size:12px;
    }

    #morePanel .dropdown-menu {
      position:static !important;
      max-height:40vh;
      overflow:auto;
      margin:5px 0 8px;
      padding:7px;
      background:#15191f;
      border-radius:8px;
    }

    /* Kick sound button is a direct child of the card, not inside the iframe. */
    .card .kick-sound-toggle {
      display:flex !important;
      position:absolute !important;
      top:8px !important;
      left:8px !important;
      z-index:2147483001 !important;
      align-items:center !important;
      justify-content:center !important;
      min-height:42px !important;
      padding:9px 12px !important;
      border:1px solid rgba(255,255,255,.45) !important;
      border-radius:8px !important;
      background:#176b45 !important;
      color:#fff !important;
      font-size:13px !important;
      font-weight:700 !important;
      opacity:1 !important;
      visibility:visible !important;
      pointer-events:auto !important;
      touch-action:manipulation !important;
      -webkit-tap-highlight-color:transparent;
    }

    .card .kick-sound-toggle.is-unmuted {
      background:#9a5b13 !important;
    }

    @media(max-width:700px) {
      #moreButton {
        top:7px !important;
        right:7px !important;
        min-height:36px;
      }

      #morePanel {
        top:49px !important;
        right:7px !important;
        left:7px !important;
        width:auto;
        max-height:70vh;
      }

      .card .kick-sound-toggle {
        top:7px !important;
        left:7px !important;
        min-height:44px !important;
        font-size:13px !important;
      }
    }
  </style>
</head>

<body>

<div class="top-bar">
  <h2>🔥 Advanced Multi Stream</h2>

  <input id="link" placeholder="Paste YouTube or Kick channel link">

  <button onclick="addStream()">Add</button>

  <h3>
    🟢 Online:
    <span id="viewerCount">0</span>
  </h3>
</div>

<button id="moreButton" type="button" aria-expanded="false">☰ More</button>
<div id="morePanel" aria-hidden="true"></div>

<div class="top-controls">
  <button onclick="playAll()">▶ Play</button>
  <button onclick="pauseAll()">⏸ Pause</button>
  <button onclick="muteAll()">🔇 Mute</button>
  <button onclick="unmuteAll()">🔊 Unmute</button>
  <button onclick="toggleTheme()">🌙 Theme</button>
  <button onclick="toggleGlobalFullscreen()">⛶ Full</button>
</div>

<div class="menu-panel">
  <div>
    <button onclick="toggleGridMenu()">🟦 Grid</button>

    <div id="gridMenu" class="dropdown-menu">
      <button onclick="setGridMode(1)">1×1</button>
      <button onclick="setGridMode(4)">2×2</button>
      <button onclick="setGridMode(9)">3×3</button>
      <button onclick="enableAutoGrid()">Auto</button>
    </div>
  </div>

  <div>
    <button onclick="toggleSettingsMenu()">⚙ Settings</button>

    <div id="settingsMenu" class="dropdown-menu">
      <button onclick="setGlobalQuality('default', event)">Auto Quality</button>
      <button onclick="setGlobalQuality('small', event)">144p</button>
      <button onclick="setGlobalQuality('medium', event)">360p</button>
      <button onclick="setGlobalQuality('large', event)">480p</button>
      <button onclick="setGlobalQuality('hd720', event)">720p</button>
      <button onclick="setGlobalQuality('hd1080', event)">1080p</button>
    </div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
  Developed by Amal Joshy🔥
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBTPrDoxWQdEWLLHsUuJbv6cQX1vUd6lQY",
  authDomain: "multi-stream-ddb1d.firebaseapp.com",
  databaseURL: "https://multi-stream-ddb1d-default-rtdb.firebaseio.com",
  projectId: "multi-stream-ddb1d",
  appId: "1:305282777189:web:50adf19c4bbb1c8005c68c"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let apiReady = false;

function onYouTubeIframeAPIReady(){
  apiReady = true;
}

let players = {};
let manualGridEnabled = false;
let maxVisibleStreams = 9;

const userId = Math.random().toString(36).substring(2);
const userRef = db.ref("users/" + userId);

db.ref(".info/connected").on("value", snap => {
  if(snap.val()){
    userRef.set(true);
    userRef.onDisconnect().remove();
  }
});

db.ref("users").on("value", snap => {
  document.getElementById("viewerCount").innerText = snap.numChildren();
});

db.ref("streams/gaming").on("value", snap => {

  const grid = document.getElementById("grid");

  Object.values(players).forEach(player => {
    if(player.destroy){
      player.destroy();
    }
  });

  players = {};
  grid.innerHTML = "";

  if(!manualGridEnabled){
    updateGrid(snap.numChildren());
  }

  snap.forEach(child => {
    createPlayer(child.val(), child.key);
  });

  applyVisibility();
});

function addStream(){

  const input = document.getElementById("link");
  const url = input.value.trim();

  const youtubeId = getId(url);
  const kickChannel = getKickChannel(url);

  let streamData;

  if(youtubeId){
    streamData = youtubeId;
  }else if(kickChannel){
    streamData = {
      platform: "kick",
      channel: kickChannel
    };
  }else{
    alert("Invalid link. Paste a YouTube video/live link or Kick channel link.");
    return;
  }

  db.ref("streams/gaming").once("value", snap => {

    if(snap.numChildren() >= 9){
      alert("Maximum 9 streams");
      return;
    }

    db.ref("streams/gaming").push(streamData);
    input.value = "";

  });
}

function createPlayer(streamData,key){

  let platform = "youtube";
  let videoId = null;
  let kickChannel = null;

  if(typeof streamData === "string"){
    videoId = streamData;
  }else if(streamData && typeof streamData === "object"){
    platform = streamData.platform || "youtube";
    videoId = streamData.videoId || streamData.id || null;
    kickChannel = streamData.channel || null;
  }

  if(platform === "youtube" && !apiReady){
    setTimeout(() => createPlayer(streamData,key),500);
    return;
  }

  const grid = document.getElementById("grid");

  let div = document.createElement("div");
  div.className = "card";

  let playerDiv = document.createElement("div");
  playerDiv.className = "player";
  playerDiv.id = "player-" + key;

  div.appendChild(playerDiv);

  let controls = document.createElement("div");
  controls.className = "controls";

  if(platform === "youtube"){

    let volume = document.createElement("input");
    volume.type = "range";
    volume.min = 0;
    volume.max = 100;
    volume.value = 100;
    volume.className = "volume-slider";
    volume.title = "YouTube volume";

    volume.oninput = () => {
      if(players[key]){
        try{
          players[key].setVolume(Number(volume.value));
        }catch(err){}
      }
    };

    controls.appendChild(volume);
  }

  let fullBtn = document.createElement("button");
  fullBtn.innerText = "⛶";
  fullBtn.title = "Fullscreen";

  fullBtn.onclick = () => {
    if(!document.fullscreenElement){
      if(div.requestFullscreen) div.requestFullscreen();
    }else{
      document.exitFullscreen();
    }
  };

  controls.appendChild(fullBtn);

  let favBtn = document.createElement("button");
  favBtn.innerText = "⭐";
  favBtn.title = "Favorite";
  favBtn.onclick = () => favBtn.classList.toggle("favorite");

  controls.appendChild(favBtn);

  let delBtn = document.createElement("button");
  delBtn.innerText = "X";
  delBtn.title = "Remove stream";
  delBtn.onclick = () => {
    db.ref("streams/gaming/" + key).remove();
  };

  controls.appendChild(delBtn);

  div.appendChild(controls);
  grid.appendChild(div);

  if(platform === "kick" && kickChannel){

    const iframe = document.createElement("iframe");
    let kickMuted = true;

    iframe.src = "https://player.kick.com/" +
      encodeURIComponent(kickChannel) +
      "?autoplay=true&muted=true";

    iframe.title = "Kick live stream: " + kickChannel;
    iframe.allow = "autoplay; fullscreen; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.setAttribute("scrolling", "no");
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "0";
    playerDiv.appendChild(iframe);

    // Place the sound control directly on the card, outside the iframe/player.
    const soundButton = document.createElement("button");
    soundButton.type = "button";
    soundButton.className = "kick-sound-toggle";
    soundButton.textContent = "🔊 Unmute";
    soundButton.setAttribute("aria-label", "Unmute Kick stream");
    soundButton.title = "Unmute Kick stream (restarts the player)";

    soundButton.addEventListener("click", function(event){
      event.preventDefault();
      event.stopPropagation();
      kickMuted = !kickMuted;
      const params = new URLSearchParams({
        autoplay: "true",
        muted: String(kickMuted)
      });
      iframe.src = "https://player.kick.com/" +
        encodeURIComponent(kickChannel) + "?" + params.toString();
      soundButton.textContent = kickMuted ? "🔊 Unmute" : "🔇 Mute";
      soundButton.setAttribute(
        "aria-label",
        kickMuted ? "Unmute Kick stream" : "Mute Kick stream"
      );
      soundButton.title = kickMuted
        ? "Unmute Kick stream (restarts the player)"
        : "Mute Kick stream (restarts the player)";
      soundButton.classList.toggle("is-unmuted", !kickMuted);
    });

    div.appendChild(soundButton);
    return;
  }

  if(platform === "youtube" && videoId){

    players[key] = new YT.Player(playerDiv.id, {

      width:"100%",
      height:"100%",
      videoId:videoId,

      playerVars:{
        autoplay:1,
        mute:1,
        controls:1,
        playsinline:1,
        enablejsapi:1
      },

      events:{
        onReady:function(event){
          event.target.playVideo();
        }
      }

    });
  }
}

function playAll(){
  Object.values(players).forEach(player => {
    try{player.playVideo();}catch(err){}
  });
}

function pauseAll(){
  Object.values(players).forEach(player => {
    try{player.pauseVideo();}catch(err){}
  });
}

function muteAll(){
  Object.values(players).forEach(player => {
    try{player.mute();}catch(err){}
  });
}

function unmuteAll(){
  Object.values(players).forEach(player => {
    try{player.unMute();}catch(err){}
  });
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

function toggleGlobalFullscreen(){

  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

function toggleGridMenu(){

  const menu = document.getElementById("gridMenu");

  menu.style.display =
    menu.style.display === "flex" ? "none" : "flex";
}

function toggleSettingsMenu(){

  const menu = document.getElementById("settingsMenu");

  menu.style.display =
    menu.style.display === "flex" ? "none" : "flex";
}

function updateGrid(count){

  const grid = document.getElementById("grid");

  if(count === 1){
    grid.style.gridTemplateColumns = "1fr";
  }else if(count <= 4){
    grid.style.gridTemplateColumns = "repeat(2,1fr)";
  }else{
    grid.style.gridTemplateColumns = "repeat(3,1fr)";
  }
}

function setGridMode(limit){

  manualGridEnabled = true;
  maxVisibleStreams = limit;

  const grid = document.getElementById("grid");

  if(limit === 1){
    grid.style.gridTemplateColumns = "1fr";
  }else if(limit === 4){
    grid.style.gridTemplateColumns = "repeat(2,1fr)";
  }else{
    grid.style.gridTemplateColumns = "repeat(3,1fr)";
  }

  applyVisibility();
}

function enableAutoGrid(){

  manualGridEnabled = false;
  maxVisibleStreams = 9;

  updateGrid(document.querySelectorAll(".card").length);
  applyVisibility();
}

function applyVisibility(){

  const cards = document.querySelectorAll(".card");

  cards.forEach((card,index) => {
    card.style.display =
      index < maxVisibleStreams ? "block" : "none";
  });
}

function setGlobalQuality(quality, clickEvent){

  document
    .querySelectorAll("#settingsMenu button")
    .forEach(btn => btn.classList.remove("active-quality"));

  if(clickEvent && clickEvent.target){
    clickEvent.target.classList.add("active-quality");
  }

  Object.values(players).forEach(player => {
    try{
      if(player && player.setPlaybackQualityRange){
        player.setPlaybackQualityRange(quality,quality);
        player.setPlaybackQuality(quality);
      }
    }catch(err){
      console.log(err);
    }
  });
}

function getId(url){

  try{

    const parsed = new URL(url);
    const host = parsed.hostname.replace(/^www\./,"").toLowerCase();

    if(host === "youtu.be"){
      return parsed.pathname.split("/").filter(Boolean)[0] || null;
    }

    if(
      host === "youtube.com" ||
      host === "m.youtube.com" ||
      host === "youtube-nocookie.com"
    ){

      const pathParts = parsed.pathname.split("/").filter(Boolean);

      if(parsed.pathname === "/watch"){
        return parsed.searchParams.get("v");
      }

      if(["shorts","live","embed"].includes(pathParts[0])){
        return pathParts[1] || null;
      }
    }

  }catch(err){}

  return null;
}

function getKickChannel(url){

  try{

    let candidate = url.trim();

    if(!/^https?:\/\//i.test(candidate)){
      candidate = "https://" + candidate;
    }

    const parsed = new URL(candidate);
    const host = parsed.hostname.replace(/^www\./,"").toLowerCase();

    if(host !== "kick.com"){

      if(/^[a-zA-Z0-9_]{1,25}$/.test(url.trim())){
        return url.trim();
      }

      return null;
    }

    const parts = parsed.pathname.split("/").filter(Boolean);

    if(parts.length !== 1) return null;

    const channel = parts[0];

    return /^[a-zA-Z0-9_]{1,25}$/.test(channel) ? channel : null;

  }catch(err){
    return null;
  }
}

// Floating Home button

const backBtn = document.createElement("button");

backBtn.innerText = "⬅ Home";
backBtn.className = "home-button";
backBtn.style.position = "fixed";
backBtn.style.top = "15px";
backBtn.style.left = "15px";
backBtn.style.zIndex = "999999";
backBtn.style.background = "red";
backBtn.style.color = "white";
backBtn.style.border = "none";
backBtn.style.padding = "10px";
backBtn.style.borderRadius = "8px";

backBtn.onclick = () => {
  location.href = "index.html";
};

document.body.appendChild(backBtn);

new Sortable(
  document.getElementById("grid"),
  {
    animation:150
  }
);

</script>

<script>
(function () {
  const grid = document.getElementById("grid");
  const moreButton = document.getElementById("moreButton");
  const morePanel = document.getElementById("morePanel");
  const topControls = document.querySelector(".top-controls");
  const menuPanel = document.querySelector(".menu-panel");
  if (!grid || !moreButton || !morePanel) return;

  // Put all existing global controls inside the always-present More panel.
  if (topControls) morePanel.appendChild(topControls);
  if (menuPanel) morePanel.appendChild(menuPanel);

  function closeMore() {
    document.body.classList.remove("more-open");
    moreButton.setAttribute("aria-expanded", "false");
    morePanel.setAttribute("aria-hidden", "true");
  }

  moreButton.addEventListener("click", function (event) {
    event.preventDefault();
    event.stopPropagation();
    const open = !document.body.classList.contains("more-open");
    document.body.classList.toggle("more-open", open);
    moreButton.setAttribute("aria-expanded", String(open));
    morePanel.setAttribute("aria-hidden", String(!open));
  });

  morePanel.addEventListener("click", function (event) {
    event.stopPropagation();
  });

  document.addEventListener("click", function (event) {
    if (!morePanel.contains(event.target) && event.target !== moreButton) {
      closeMore();
    }
  });

  function fitStreamsToScreen() {
    if (window.innerWidth > 700) return;
    const allCards = Array.from(grid.querySelectorAll(":scope > .card"));
    const visibleCards = allCards.filter(card => getComputedStyle(card).display !== "none");
    const count = visibleCards.length;
    if (!count) return;
    const columns = count === 1 ? 1 : (count <= 4 ? 2 : 3);
    const rows = Math.ceil(count / columns);
    grid.style.display = "grid";
    grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    grid.style.gridAutoRows = "minmax(0, 1fr)";
    grid.style.alignContent = "stretch";
    visibleCards.forEach(card => {
      card.style.minWidth = "0";
      card.style.minHeight = "0";
      card.style.height = "100%";
    });
  }

  const observer = new MutationObserver(() => requestAnimationFrame(fitStreamsToScreen));
  observer.observe(grid, { childList: true });
  window.addEventListener("resize", fitStreamsToScreen);
  window.addEventListener("orientationchange", () => setTimeout(fitStreamsToScreen, 200));
  document.addEventListener("fullscreenchange", function () {
    const globalFullscreen = document.fullscreenElement === document.documentElement;
    document.documentElement.classList.toggle("global-fullscreen", globalFullscreen);
    if (!globalFullscreen) closeMore();
    fitStreamsToScreen();
  });
  [100, 500, 1200, 2200].forEach(delay => setTimeout(fitStreamsToScreen, delay));
})();
</script>

</body>
</html>
